<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <script src="language-sync.js"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon.svg">
    <script src="theme-sync.js"></script>
    <title>Social Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --persian-blue: #0066cc;
            --persian-red: #c0392b;
            --persian-gold: #d4a574;
            --persian-green: #1fb580;
            --persian-purple: #9b59b6;
            --persian-orange: #e67e22;
            --text-dark: #1a1a1a;
            --text-gray: #5a5a5a;
            --border-light: #d4cec3;
            --shadow-light: rgba(0,102,204,0.08);
            --shadow-medium: rgba(0,102,204,0.12);
            --shadow-dark: rgba(0,102,204,0.15);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
        }

        [data-theme="dark"] {
            --text-dark: #f8f9fa;
            --text-gray: #adb5bd;
            --glass-bg: rgba(45, 52, 54, 0.1);
            --glass-border: rgba(52, 73, 94, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 20% 50%, rgba(0,102,204,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(192,57,43,0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(212,165,116,0.1) 0%, transparent 50%),
                linear-gradient(135deg, #f5f3f0 0%, #e8f4f2 50%, #f0f8f6 100%);
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4a574' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        body[data-theme="dark"] {
            background:
                radial-gradient(circle at 20% 50%, rgba(0,102,204,0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(192,57,43,0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(212,165,116,0.2) 0%, transparent 50%),
                linear-gradient(135deg, #1a1a1a 0%, #2d3436 50%, #34495e 100%);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--persian-blue);
            transform: translateX(5px);
        }

        /* ═══════════ هدر ═══════════ */
        .social-header {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(250,248,243,0.9) 100%);
            border-radius: 32px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 50px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
            animation: slideInDown 0.6s ease;
        }

        [data-theme="dark"] .social-header {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .header-text h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .header-text p {
            font-size: 18px;
            color: var(--text-gray);
            margin: 0;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
        }

        .stat-box {
            text-align: center;
            padding: 20px;
            background: rgba(0,102,204, 0.08);
            border-radius: 16px;
            border: 2px solid rgba(0,102,204, 0.2);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--persian-blue);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ═══════════ ناوبری اصلی ═══════════ */
        .main-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0,102,204,0.15);
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 14px 24px;
            border: none;
            background: transparent;
            color: var(--text-gray);
            font-weight: 700;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            position: relative;
            top: 2px;
        }

        .nav-btn:hover {
            color: var(--persian-blue);
        }

        .nav-btn.active {
            color: var(--persian-blue);
            border-bottom-color: var(--persian-blue);
        }

        .nav-content {
            display: none;
        }

        .nav-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════ پروفایل ═══════════ */
        .profile-section {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .profile-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
            text-align: center;
        }

        [data-theme="dark"] .profile-card {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            font-weight: 700;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .profile-level {
            font-size: 16px;
            color: var(--persian-gold);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .profile-stat {
            padding: 12px;
            background: rgba(0,102,204, 0.08);
            border-radius: 12px;
        }

        .profile-stat-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--persian-blue);
            display: block;
        }

        .profile-stat-label {
            font-size: 12px;
            color: var(--text-gray);
            font-weight: 600;
        }

        .profile-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.gold { background: var(--persian-gold); color: white; }
        .badge.silver { background: #c0c0c0; color: white; }
        .badge.bronze { background: #cd7f32; color: white; }

        .profile-feed {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
        }

        [data-theme="dark"] .profile-feed {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .feed-item {
            padding: 20px;
            border-bottom: 1px solid rgba(0,102,204,0.1);
            transition: all 0.2s ease;
        }

        .feed-item:hover {
            background: rgba(0,102,204, 0.05);
            border-radius: 12px;
        }

        .feed-item:last-child {
            border-bottom: none;
        }

        .feed-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .feed-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: 700;
        }

        .feed-content {
            flex: 1;
        }

        .feed-user {
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .feed-action {
            font-size: 14px;
            color: var(--text-gray);
        }

        .feed-text {
            font-size: 16px;
            color: var(--text-dark);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .feed-meta {
            font-size: 12px;
            color: var(--text-gray);
        }

        /* ═══════════ چت ═══════════ */
        .chat-section {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            height: 600px;
        }

        .chat-sidebar {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
        }

        [data-theme="dark"] .chat-sidebar {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .chat-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .chat-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: rgba(0,102,204, 0.1);
            color: var(--text-gray);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .chat-tab.active {
            background: var(--persian-blue);
            color: white;
        }

        .chat-list {
            height: 480px;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 8px;
        }

        .chat-item:hover, .chat-item.active {
            background: rgba(0,102,204, 0.1);
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: 700;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .chat-last-msg {
            font-size: 12px;
            color: var(--text-gray);
        }

        .chat-main {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
            display: flex;
            flex-direction: column;
        }

        [data-theme="dark"] .chat-main {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0,102,204,0.1);
            margin-bottom: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: var(--persian-blue);
            color: white;
            margin-left: auto;
        }

        .message.other .message-bubble {
            background: rgba(0,102,204, 0.1);
            color: var(--text-dark);
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 10px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        .message.own .message-time {
            text-align: left;
        }

        .message.other .message-time {
            text-align: right;
        }

        .chat-input {
            display: flex;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,102,204,0.1);
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(0,102,204, 0.2);
            border-radius: 24px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .chat-input input {
            background: rgba(30, 40, 45, 0.9);
        }

        .chat-input input:focus {
            outline: none;
            border-color: var(--persian-blue);
            box-shadow: 0 0 15px rgba(0,102,204, 0.2);
        }

        .chat-input button {
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        /* ═══════════ گروه‌ها ═══════════ */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .group-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        [data-theme="dark"] .group-card {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .group-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px var(--shadow-medium);
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .group-avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: 700;
        }

        .group-info {
            flex: 1;
        }

        .group-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .group-members {
            font-size: 12px;
            color: var(--text-gray);
        }

        .group-description {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .group-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-gray);
        }

        /* ═══════════ لیگ ═══════════ */
        .league-section {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
        }

        .leaderboard {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
        }

        [data-theme="dark"] .leaderboard {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .leaderboard-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--persian-blue);
            margin-bottom: 24px;
            text-align: center;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .leaderboard-item:hover {
            background: rgba(0,102,204, 0.05);
        }

        .leaderboard-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
        }

        .leaderboard-rank.gold { background: var(--persian-gold); color: white; }
        .leaderboard-rank.silver { background: #c0c0c0; color: white; }
        .leaderboard-rank.bronze { background: #cd7f32; color: white; }
        .leaderboard-rank.other { background: rgba(0,102,204, 0.1); color: var(--persian-blue); }

        .leaderboard-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--persian-blue), var(--persian-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: 700;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .leaderboard-score {
            font-size: 12px;
            color: var(--text-gray);
        }

        .leaderboard-points {
            font-size: 18px;
            font-weight: 800;
            color: var(--persian-blue);
        }

        .achievements {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(0,102,204,0.15);
        }

        [data-theme="dark"] .achievements {

    <script>
        // ============ متغیرهای عمومی ============
        let currentUser = null;
        let currentChat = null;
        let chatType = 'private';
        let users = [];
        let groups = [];

        // ============ بارگذاری اولیه ============

        // ============ مدیریت داده‌ها ============

                        text: 'کی می‌خواد جلسه زبان برگزار کنیم؟',

                    }

            // دستاوردها
            if (!localStorage.getItem('socialAchievements')) {
                const sampleAchievements = [
                    { id: 'starter', name: 'شروع کننده', desc: 'اولین هدف را ایجاد کن', icon: '🎯', unlocked: true },
                    { id: 'goal_master', name: 'استاد اهداف', desc: '۱۰ هدف تکمیل کن', icon: '🏆', unlocked: false },
                    { id: 'consistent', name: 'پایدار', desc: '۳۰ روز متوالی فعالیت کن', icon: '📅', unlocked: false },
                    { id: 'social_butterfly', name: 'پروانه اجتماعی', desc: 'با ۵ نفر چت کن', icon: '🦋', unlocked: false },
                    { id: 'team_player', name: 'بازیکن تیم', desc: 'به ۳ گروه بپیوند', icon: '🤝', unlocked: false },
                    { id: 'mentor', name: 'مربی', desc: '۵ نفر را راهنمایی کن', icon: '👨‍🏫', unlocked: false },
                    { id: 'champion', name: 'قهرمان', desc: 'رتبه ۱ لیگ را کسب کن', icon: '👑', unlocked: false }

        function loadCurrentUser() {
            users = JSON.parse(localStorage.getItem('socialUsers')) || [];
            currentUser = users.find(u => u.id === 1) || users[0];
        }

        function loadUsers() {
            users = JSON.parse(localStorage.getItem('socialUsers')) || [];
        }

        function loadGroups() {
            groups = JSON.parse(localStorage.getItem('socialGroups')) || [];
        }

        function loadMessages() {
            messages = JSON.parse(localStorage.getItem('socialMessages')) || [];
        }

        function loadAchievements() {
            achievements = JSON.parse(localStorage.getItem('socialAchievements')) || [];
        }

        // ============ به‌روزرسانی UI ============
        function updateUI() {
            // آمار هدر
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalGroups').textContent = groups.length;
            document.getElementById('totalMessages').textContent = messages.length;
            document.getElementById('userRank').textContent = calculateUserRank();

            // پروفایل
            if (currentUser) {
                document.getElementById('userAvatar').textContent = currentUser.avatar;
                document.getElementById('userName').textContent = currentUser.displayName;
                document.getElementById('userLevel').textContent = `سطح ${currentUser.level}`;
                document.getElementById('userGoals').textContent = currentUser.goals;
                document.getElementById('userPoints').textContent = currentUser.points.toLocaleString();

                // پروفایل کامل
                document.getElementById('profileAvatar').textContent = currentUser.avatar;
                document.getElementById('profileName').textContent = currentUser.displayName;
                document.getElementById('profileLevel').textContent = `سطح ${currentUser.level}`;
                document.getElementById('profileDisplayName').value = currentUser.displayName;
                document.getElementById('profileBio').value = currentUser.bio || '';

                renderBadges();
            }
        }

        function calculateUserRank() {
            const sortedUsers = [...users].sort((a, b) => b.points - a.points);
            return sortedUsers.findIndex(u => u.id === currentUser.id) + 1;
        }

        function renderBadges() {
            const badgesContainer = document.getElementById('userBadges');
            badgesContainer.innerHTML = '';

            if (currentUser && currentUser.badges) {
                currentUser.badges.forEach(badgeId => {
                    const achievement = achievements.find(a => a.id === badgeId);
                    if (achievement) {
                        const badgeClass = badgeId.includes('gold') ? 'gold' :
                                         badgeId.includes('silver') ? 'silver' : 'bronze';
                        badgesContainer.innerHTML += `
                            <div class="badge ${badgeClass}" title="${achievement.desc}">
                                ${achievement.icon} ${achievement.name}
                            </div>
                        `;
                    }
                });
            }
        }

        // ============ فید ============
        function renderFeed() {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = '';

            // فعالیت‌های نمونه
            const activities = [
                {
                    user: users[1],
                    action: 'هدف جدیدی ایجاد کرد',
                    text: 'یادگیری زبان انگلیسی در ۶ ماه',
                    time: '۲ ساعت پیش'
                },
                {
                    user: users[2],
                    action: 'هدفی را تکمیل کرد',
                    text: 'تمرین روزانه بدنسازی',
                    time: '۴ ساعت پیش'
                },
                {
                    user: users[3],
                    action: 'به گروه جدیدی پیوست',
                    text: 'گروه توسعه شخصی',
                    time: '۱ روز پیش'
                }
            ];

            activities.forEach(activity => {
                feedContainer.innerHTML += `
                    <div class="feed-item">
                        <div class="feed-header">
                            <div class="feed-avatar">${activity.user.avatar}</div>
                            <div class="feed-content">
                                <div class="feed-user">${activity.user.displayName}</div>
                                <div class="feed-action">${activity.action}</div>
                            </div>
                        </div>
                        <div class="feed-text">${activity.text}</div>
                        <div class="feed-meta">${activity.time}</div>
                    </div>
                `;
            });
        }

        // ============ چت ============
        function switchChatTab(type, button) {
            chatType = type;
            document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
            if (button) button.classList.add('active');
            renderChatList();
        }

        function renderChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            if (chatType === 'private') {
                // چت‌های خصوصی
                const privateChats = users.filter(u => u.id !== currentUser.id);
                privateChats.forEach(user => {
                    const lastMessage = messages
                        .filter(m => (m.from === user.id && m.to === currentUser.id) ||
                                   (m.from === currentUser.id && m.to === user.id))
                        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

                    chatList.innerHTML += `
                        <div class="chat-item" onclick="openChat('private', ${user.id})">
                            <div class="chat-avatar">${user.avatar}</div>
                            <div class="chat-info">
                                <div class="chat-name">${user.displayName}</div>
                                <div class="chat-last-msg">${lastMessage ? lastMessage.text.substring(0, 30) + '...' : 'پیام جدیدی ندارید'}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                // چت‌های گروهی
                groups.forEach(group => {
                    if (group.members.includes(currentUser.id)) {
                        const lastMessage = messages
                            .filter(m => m.groupId === group.id)
                            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

                        chatList.innerHTML += `
                            <div class="chat-item" onclick="openChat('group', ${group.id})">
                                <div class="chat-avatar">${group.avatar}</div>
                                <div class="chat-info">
                                    <div class="chat-name">${group.name}</div>
                                    <div class="chat-last-msg">${lastMessage ? lastMessage.text.substring(0, 30) + '...' : 'پیام جدیدی ندارید'}</div>
                                </div>
                            </div>
                        `;
                    }
                });
            }
        }

        function openChat(type, id) {
            currentChat = { type, id };

            if (type === 'private') {
                const user = users.find(u => u.id === id);
                document.getElementById('chatTitle').textContent = user.displayName;
                document.getElementById('chatSubtitle').textContent = `آنلاین`;
            } else {
                const group = groups.find(g => g.id === id);
                document.getElementById('chatTitle').textContent = group.name;
                document.getElementById('chatSubtitle').textContent = `${group.members.length} عضو`;
            }

            renderMessages();
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function renderMessages() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = '';

            if (!currentChat) return;

            let chatMessages = [];
            if (currentChat.type === 'private') {
                chatMessages = messages.filter(m =>
                    (m.from === currentChat.id && m.to === currentUser.id) ||
                    (m.from === currentUser.id && m.to === currentChat.id)
                );
            } else {
                chatMessages = messages.filter(m => m.groupId === currentChat.id);
            }

            chatMessages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            chatMessages.forEach(message => {
                const sender = users.find(u => u.id === message.from);
                const isOwn = message.from === currentUser.id;

                messagesContainer.innerHTML += `
                    <div class="message ${isOwn ? 'own' : 'other'}">
                        <div class="message-avatar">${sender.avatar}</div>
                        <div class="message-content">
                            <div class="message-bubble">
                                <div class="message-text">${message.text}</div>
                            </div>
                            <div class="message-time">${formatTime(message.timestamp)}</div>
                        </div>
                    </div>
                `;
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentChat) return;

            const message = {
                id: Date.now(),
                from: currentUser.id,
                to: currentChat.type === 'private' ? currentChat.id : null,
                groupId: currentChat.type === 'group' ? currentChat.id : null,
                type: currentChat.type,
                text: text,
                timestamp: new Date().toISOString(),
                read: false
            };

            messages.push(message);
            localStorage.setItem('socialMessages', JSON.stringify(messages));

            input.value = '';
            renderMessages();
            updateUI();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'همین الان';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} دقیقه پیش`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} ساعت پیش`;
            return date.toLocaleDateString('fa-IR');
        }

        // ============ گروه‌ها ============
        function renderGroups() {
            const groupsContainer = document.getElementById('groupsContainer');
            groupsContainer.innerHTML = '';

            groups.forEach(group => {
                if (group.members.includes(currentUser.id)) {
                    groupsContainer.innerHTML += `
                        <div class="group-card" onclick="openGroupChat(${group.id})">
                            <div class="group-header">
                                <div class="group-avatar">${group.avatar}</div>
                                <div class="group-info">
                                    <div class="group-name">${group.name}</div>
                                    <div class="group-members">${group.members.length} عضو</div>
                                </div>
                            </div>
                            <div class="group-description">${group.description}</div>
                            <div class="group-stats">
                                <span>ایجاد شده ${formatTime(group.createdAt)}</span>
                                <span>👥 ${group.members.length} عضو</span>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function createGroup() {
            const groupName = prompt('نام گروه را وارد کنید:');
            if (!groupName) return;

            const groupDesc = prompt('توضیحات گروه را وارد کنید:');
            if (!groupDesc) return;

            const group = {
                id: Date.now(),
                name: groupName,
                description: groupDesc,
                avatar: '👥',
                members: [currentUser.id],
                createdBy: currentUser.id,
                createdAt: new Date().toISOString()
            };

            groups.push(group);
            localStorage.setItem('socialGroups', JSON.stringify(groups));
            renderGroups();
            updateUI();
        }

        function openGroupChat(groupId) {
            switchSection('chat');
            switchChatTab('groups');
            setTimeout(() => openChat('group', groupId), 100);
        }

        // ============ لیگ ============
        function renderLeaderboard() {
            const leaderboardContainer = document.getElementById('leaderboardContainer');
            leaderboardContainer.innerHTML = '';

            const sortedUsers = [...users].sort((a, b) => b.points - a.points);

            sortedUsers.forEach((user, index) => {
                const rank = index + 1;
                let rankClass = 'other';
                if (rank === 1) rankClass = 'gold';
                else if (rank === 2) rankClass = 'silver';
                else if (rank === 3) rankClass = 'bronze';

                leaderboardContainer.innerHTML += `
                    <div class="leaderboard-item">
                        <div class="leaderboard-rank ${rankClass}">${rank}</div>
                        <div class="leaderboard-avatar">${user.avatar}</div>
                        <div class="leaderboard-info">
                            <div class="leaderboard-name">${user.displayName}</div>
                            <div class="leaderboard-score">سطح ${user.level} • ${user.goals} هدف</div>
                        </div>
                        <div class="leaderboard-points">${user.points.toLocaleString()}</div>
                    </div>
                `;
            });
        }

        function renderAchievements() {
            const achievementsContainer = document.getElementById('achievementsContainer');
            achievementsContainer.innerHTML = '';

            achievements.forEach(achievement => {
                const isUnlocked = currentUser.badges && currentUser.badges.includes(achievement.id);
                achievementsContainer.innerHTML += `
                    <div class="achievement-item ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div class="achievement-name">${achievement.name}</div>
                        <div class="achievement-desc">${achievement.desc}</div>
                    </div>
                `;
            });
        }

        // ============ پروفایل ============
        function updateProfile() {
            const displayName = document.getElementById('profileDisplayName').value.trim();
            const bio = document.getElementById('profileBio').value.trim();

            if (displayName) {
                currentUser.displayName = displayName;
                currentUser.bio = bio;
                localStorage.setItem('socialUsers', JSON.stringify(users));
                updateUI();
                alert('پروفایل با موفقیت به‌روزرسانی شد! ✅');
            }
        }

        // ============ ناوبری ============
        function switchSection(sectionName, button) {
            document.querySelectorAll('.nav-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionName).classList.add('active');
            if (button) button.classList.add('active');
        }

        // ============ تم ============
        function loadTheme() {
            const theme = localStorage.getItem('dashboardTheme') || 'light';
            document.body.setAttribute('data-theme', theme);
        }
    </script>
    <script src="assistant-engine.js"></script>
    <script src="runtime-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="i18n-data.js"></script>
    <script src="i18n.js"></script>
    <script src="pwa-register.js"></script>
</body>
</html>
