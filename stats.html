<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <script src="language-sync.js"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon.svg">
    <script src="theme-sync.js"></script>
    <title>My Analytics & Reports</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --persian-green: #1fb580;
            --accent-teal: #17a2b8;
            --light-teal: #e0f2f1;
            --text-dark: #1a1a1a;
            --text-gray: #5a5a5a;
        }

        body {
            background: linear-gradient(135deg, #f5f3f0 0%, #e8f4f2 50%, #f0f8f6 100%);
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background-attachment: fixed;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 30px;
        }

        .header h1 {
            color: var(--persian-green);
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .header p {
            color: var(--text-gray);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 500;
        }

        .stats-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .grid-2 { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 24px; 
            margin-top: 30px;
        }

        .stat-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            padding: 32px; 
            border-radius: 18px; 
            box-shadow: 0 12px 32px rgba(31, 181, 128, 0.08), 0 1px 3px rgba(0,0,0,0.04);
            text-align: center;
            border: 2px solid rgba(31, 181, 128, 0.15);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(31, 181, 128, 0.12), 0 1px 3px rgba(0,0,0,0.04);
            border-color: var(--persian-green);
        }

        .stat-number { 
            font-size: 44px; 
            font-weight: 800; 
            color: var(--persian-green); 
            margin: 16px 0;
            letter-spacing: -1px;
        }

        .stat-label { 
            color: var(--text-gray); 
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Progress Bar */
        .progress-box { 
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            padding: 32px; 
            border-radius: 18px; 
            margin-top: 28px; 
            box-shadow: 0 12px 32px rgba(31, 181, 128, 0.08), 0 1px 3px rgba(0,0,0,0.04);
            border: 2px solid rgba(31, 181, 128, 0.15);
        }

        .progress-box h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--persian-green);
            margin-top: 0;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .progress-bar-bg { 
            background: rgba(224, 242, 241, 0.8);
            height: 12px; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-top: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .progress-fill { 
            background: linear-gradient(90deg, var(--persian-green) 0%, var(--accent-teal) 100%);
            height: 100%; 
            width: 0%; 
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px rgba(31, 181, 128, 0.3);
        }

        #taskPercentText {
            text-align: left; 
            font-weight: 700; 
            margin-top: 12px;
            color: var(--persian-green);
            font-size: 16px;
        }
    </style>
    <link rel="stylesheet" href="theme-system.css">
</head>
<body>

    <div class="header">
        <h1>📊 گزارش عملکرد شما</h1>
        <p>اعداد دروغ نمیگن! ببینیم چقدر پیشرفت کردی.</p>
    </div>

    <div class="stats-container">
        <a href="index.html" style="text-decoration: none; color: #95a5a6;">🔙 بازگشت به داشبورد</a>

        <div class="grid-2">
            <div class="stat-card">
                <div class="stat-label">تسک‌های انجام شده (کل زمان)</div>
                <div class="stat-number" id="tasksDone">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">تسک‌های باقی‌مانده</div>
                <div class="stat-number" id="tasksLeft" style="color: #e74c3c;">0</div>
            </div>
        </div>

        <div class="progress-box">
            <h3 style="margin-top:0">نرخ تکمیل تسک‌ها</h3>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="taskProgress"></div>
            </div>
            <p id="taskPercentText" style="text-align: left; font-weight: bold; margin-top: 5px;">0%</p>
        </div>

        <div class="grid-2">
            <div class="stat-card">
                <div class="stat-label">عادت‌های فعال شما</div>
                <div class="stat-number" id="totalHabits">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">تیک‌های عادت زده شده (امروز)</div>
                <div class="stat-number" id="habitsToday" style="color: #2ed573;">0</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // تحلیل تسک‌ها
            const tasks = JSON.parse(localStorage.getItem('proTasks')) || [];
            const doneTasks = tasks.filter(t => t.isDone).length;
            const totalTasks = tasks.length;
            const leftTasks = totalTasks - doneTasks;
            
            document.getElementById('tasksDone').innerText = doneTasks;
            document.getElementById('tasksLeft').innerText = leftTasks;

            if(totalTasks > 0) {
                const percent = Math.round((doneTasks / totalTasks) * 100);
                document.getElementById('taskProgress').style.width = percent + '%';
                document.getElementById('taskPercentText').innerText = percent + '%';
            }

            // تحلیل عادت‌ها
            const habits = JSON.parse(localStorage.getItem('myHabits')) || [];
            document.getElementById('totalHabits').innerText = habits.length;

            const todayStr = new Date().toLocaleDateString('en-CA');
            const doneToday = habits.filter(h => h.history.includes(todayStr)).length;
            document.getElementById('habitsToday').innerText = doneToday;
        }
    </script>
    <script src="assistant-engine.js"></script>
    <script src="runtime-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="i18n-data.js"></script>
    <script src="i18n.js"></script>
    <script src="pwa-register.js"></script>
</body>
</html>
