<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسک‌مستر حرفه‌ای - پیشرفته</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="jalaali.min.js"></script>
    <script src="dashboard-data.js"></script>
    <style>
        :root {
            --persian-green: #1fb580;
            --accent-teal: #17a2b8;
            --light-teal: #e0f2f1;
            --text-dark: #1a1a1a;
            --text-gray: #5a5a5a;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
            --purple: #9b59b6;
        }

        body {
            background: linear-gradient(135deg, #f5f3f0 0%, #e8f4f2 50%, #f0f8f6 100%);
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 30px;
        }

        .header h1 {
            color: var(--persian-green);
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(31, 181, 128, 0.1);
        }

        .header p {
            color: var(--text-gray);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 500;
        }

        .task-container {
            max-width: 1200px;
            margin: 20px auto;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(31, 181, 128, 0.08), 0 1px 3px rgba(0,0,0,0.04);
            border: 2px solid rgba(224, 242, 241, 0.6);
        }

        /* نوار ابزار پیشرفته */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 24px;
            background: linear-gradient(135deg, var(--light-teal) 0%, rgba(224,242,241,0.3) 100%);
            border-radius: 18px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            gap: 20px;
            flex-wrap: wrap;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-section label {
            font-weight: 600;
            color: var(--persian-green);
            font-size: 14px;
        }

        /* جستجو */
        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            border-radius: 12px;
            font-family: 'Vazirmatn', Tahoma;
            background: white;
            font-size: 14px;
            transition: all 0.3s ease;
            color: var(--text-dark);
            font-weight: 500;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--persian-green);
            box-shadow: 0 0 0 3px rgba(31, 181, 128, 0.1);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 16px;
        }

        /* فیلترها */
        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            border-radius: 10px;
            background: white;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: 'Vazirmatn', Tahoma;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--persian-green);
            color: white;
            border-color: var(--persian-green);
            transform: translateY(-2px);
        }

        /* آمار سریع */
        .quick-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.8);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* فرم پیشرفته */
        .task-form {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(224,242,241,0.2) 100%);
            padding: 32px;
            border-radius: 20px;
            border: 2px solid rgba(31, 181, 128, 0.15);
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(31, 181, 128, 0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .recurrence-panel {
            margin-top: 16px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(224, 242, 241, 0.55);
            border: 1px solid rgba(31, 181, 128, 0.18);
        }

        .recurrence-panel.hidden {
            display: none;
        }

        .panel-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-gray);
            margin-bottom: 10px;
        }

        .recurrence-days {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .day-chip {
            min-width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(31, 181, 128, 0.18);
            background: white;
            color: var(--text-dark);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .day-chip.selected {
            background: linear-gradient(135deg, var(--persian-green) 0%, #0f8d64 100%);
            border-color: transparent;
            color: white;
            box-shadow: 0 8px 18px rgba(31, 181, 128, 0.22);
        }

        .form-hint {
            margin-top: 10px;
            color: var(--text-gray);
            font-size: 12px;
            line-height: 1.9;
        }

        .form-check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-dark);
            font-weight: 600;
        }

        .form-check-row input {
            width: 18px;
            height: 18px;
            accent-color: var(--persian-green);
            cursor: pointer;
        }

        .edit-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(255, 243, 205, 0.75);
            color: #7a5d00;
            border: 1px solid rgba(243, 156, 18, 0.28);
            font-weight: 700;
        }

        .edit-banner.visible {
            display: flex;
        }

        .meta-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .info-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(26, 115, 232, 0.08);
            color: var(--text-gray);
        }

        .input-box {
            padding: 14px 16px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            border-radius: 12px;
            font-family: 'Vazirmatn', Tahoma;
            background: white;
            font-size: 14px;
            transition: all 0.3s ease;
            color: var(--text-dark);
            font-weight: 500;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--persian-green);
            box-shadow: 0 0 0 3px rgba(31, 181, 128, 0.1);
        }

        .input-box[type="date"], .input-box[type="time"] {
            cursor: pointer;
        }

        textarea.input-box {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--persian-green) 0%, #15a07f 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Vazirmatn', Tahoma;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(31, 181, 128, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(31, 181, 128, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent-teal) 0%, #0c8599 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Vazirmatn', Tahoma;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(23, 162, 184, 0.2);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(23, 162, 184, 0.3);
        }

        /* کارت‌های تسک پیشرفته */
        .task-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(224,242,241,0.1) 100%);
            border: 2px solid rgba(31, 181, 128, 0.15);
            margin-bottom: 20px;
            padding: 28px;
            border-radius: 18px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-right: 6px solid rgba(31, 181, 128, 0.3);
            overflow: hidden;
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--persian-green), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .task-card:hover::before {
            opacity: 1;
        }

        .priority-high {
            border-right-color: #ff4757;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,71,87,0.05) 100%);
        }

        .priority-medium {
            border-right-color: #ffa502;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,165,2,0.05) 100%);
        }

        .priority-low {
            border-right-color: var(--persian-green);
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(31,181,128,0.05) 100%);
        }

        .task-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(31, 181, 128, 0.08);
            border-color: var(--persian-green);
        }

        .completed {
            opacity: 0.7;
            background: linear-gradient(135deg, rgba(224,242,241,0.5) 0%, rgba(224,242,241,0.2) 100%);
            border-right-color: var(--text-gray) !important;
        }

        .completed .task-title {
            text-decoration: line-through;
            color: var(--text-gray);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0 0 8px 0;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .task-desc {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 500;
            margin: 0 0 16px 0;
            line-height: 1.6;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* زیرتسک‌ها پیشرفته */
        .subtasks-section {
            margin-top: 20px;
        }

        .subtasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .subtasks-progress {
            font-size: 12px;
            color: var(--text-gray);
            font-weight: 600;
        }

        .subtasks-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--light-teal) 0%, rgba(224,242,241,0.3) 100%);
            border-radius: 10px;
            border: 1px solid rgba(31, 181, 128, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .subtask-item:hover {
            border-color: var(--persian-green);
            background: linear-gradient(135deg, rgba(224,242,241,0.6) 0%, var(--light-teal) 100%);
        }

        .subtask-item.completed {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1) 0%, rgba(46, 204, 113, 0.05) 100%);
            border-color: var(--success);
        }

        .subtask-item.completed .subtask-text {
            text-decoration: line-through;
            color: var(--text-gray);
            opacity: 0.7;
        }

        .subtask-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(31, 181, 128, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            position: relative;
        }

        .subtask-item.completed .subtask-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .subtask-item.completed .subtask-checkbox::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .subtask-text {
            flex: 1;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        /* بج‌ها و تگ‌ها */
        .badge {
            background: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-dark);
            font-weight: 600;
            border: 1px solid rgba(31, 181, 128, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge.priority-high {
            background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
            color: white;
            border: none;
        }

        .badge.priority-medium {
            background: linear-gradient(135deg, #ffa502 0%, #ff9f00 100%);
            color: white;
            border: none;
        }

        .badge.priority-low {
            background: linear-gradient(135deg, var(--persian-green) 0%, #15a07f 100%);
            color: white;
            border: none;
        }

        .badge.category {
            background: linear-gradient(135deg, var(--accent-teal) 0%, #0c8599 100%);
            color: white;
            border: none;
        }

        .badge.date-overdue {
            background: linear-gradient(135deg, var(--danger) 0%, #c0392b 100%);
            color: white;
            border: none;
            animation: pulse 2s infinite;
        }

        .badge.date-today {
            background: linear-gradient(135deg, var(--warning) 0%, #e67e22 100%);
            color: white;
            border: none;
        }

        .badge.date-upcoming {
            background: linear-gradient(135deg, var(--info) 0%, #2980b9 100%);
            color: white;
            border: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* نوار پیشرفت */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(224, 242, 241, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--persian-green) 0%, var(--accent-teal) 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(31, 181, 128, 0.3);
        }

        /* گروه‌بندی تسک‌ها */
        .tasks-section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--persian-green);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--persian-green);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .section-count {
            background: var(--persian-green);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .tasks-grid {
            display: grid;
            gap: 16px;
        }

        /* آمار پیشرفته */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(224,242,241,0.2) 100%);
            padding: 24px;
            border-radius: 16px;
            border: 2px solid rgba(31, 181, 128, 0.15);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(31, 181, 128, 0.06);
            border-color: var(--persian-green);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--persian-green);
            margin: 0;
            letter-spacing: -1px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-gray);
            font-weight: 600;
            margin-top: 4px;
        }

        /* نوتیفیکیشن‌ها */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.3);
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            font-weight: 600;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                gap: 16px;
            }

            .task-header {
                flex-direction: column;
                align-items: stretch;
            }

            .task-actions {
                justify-content: center;
                margin-top: 12px;
            }
        }

        /* تاریک کردن پس‌زمینه برای مودال‌ها */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlideUp 0.3s ease;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✅ تسک‌مستر پیشرفته</h1>
        <p>مدیریت هوشمند و حرفه‌ای وظایف شما</p>
    </div>

    <div class="task-container">
        <a href="index.html" style="text-decoration: none; color: var(--text-gray); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;">
            ← بازگشت به داشبورد
        </a>

        <!-- آمار سریع -->
        <div class="stats-overview" id="statsOverview">
            <!-- آمارها به صورت داینامیک اضافه می‌شوند -->
        </div>

        <!-- نوار ابزار پیشرفته -->
        <div class="toolbar">
            <div class="toolbar-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="جستجو در تسک‌ها..." onkeyup="filterTasks()">
                </div>
            </div>

            <div class="toolbar-section">
                <label>فیلتر:</label>
                <div class="filter-group">
                    <button class="filter-btn active" data-status-filter="all" onclick="setFilter('all', this)">همه</button>
                    <button class="filter-btn" data-status-filter="pending" onclick="setFilter('pending', this)">فعال</button>
                    <button class="filter-btn" data-status-filter="completed" onclick="setFilter('completed', this)">انجام شده</button>
                    <button class="filter-btn" data-status-filter="overdue" onclick="setFilter('overdue', this)">گذشته</button>
                </div>
            </div>

            <div class="toolbar-section">
                <label>اولویت:</label>
                <div class="filter-group">
                    <button class="filter-btn active" data-priority-filter="all" onclick="setPriorityFilter('all')">همه</button>
                    <button class="filter-btn" data-priority-filter="high" onclick="setPriorityFilter('high')">فوری</button>
                    <button class="filter-btn" data-priority-filter="medium" onclick="setPriorityFilter('medium')">متوسط</button>
                    <button class="filter-btn" data-priority-filter="low" onclick="setPriorityFilter('low')">عادی</button>
                </div>
            </div>

            <div class="toolbar-section">
                <div class="quick-stats" id="quickStats">
                    <!-- آمار سریع -->
                </div>
            </div>
        </div>

        <!-- فرم پیشرفته -->
        <div class="task-form">
            <input type="hidden" id="editingTaskId">
            <div class="edit-banner" id="editBanner">
                <span>در حال ویرایش این تسک هستی.</span>
                <button type="button" class="btn-secondary" onclick="clearForm()">لغو ویرایش</button>
            </div>
            <div class="form-grid">
                <input type="text" id="taskTitle" class="input-box" placeholder="عنوان تسک...">
                <select id="taskCategory" class="input-box">
                    <option value="personal">👤 شخصی</option>
                    <option value="work">💼 کاری</option>
                    <option value="study">📚 تحصیلی</option>
                    <option value="health">🏥 سلامتی</option>
                    <option value="shopping">🛒 خرید</option>
                    <option value="other">📌 سایر</option>
                </select>
                <select id="taskPriority" class="input-box">
                    <option value="low">عادی 🟢</option>
                    <option value="medium">متوسط 🟠</option>
                    <option value="high">فوری 🔴</option>
                </select>
                <input type="date" id="taskDate" class="input-box" title="تاریخ شروع">
            </div>

            <div class="form-row">
                <input type="time" id="taskTime" class="input-box" title="ساعت شروع">
                <input type="time" id="taskEndTime" class="input-box" title="ساعت پایان">
            </div>

            <div class="form-row" style="margin-top: 16px;">
                <select id="taskRecurring" class="input-box">
                    <option value="none">بدون تکرار</option>
                    <option value="daily">روزانه</option>
                    <option value="weekly">هفتگی</option>
                    <option value="monthly">ماهانه</option>
                </select>
                <input type="date" id="taskRecurringUntil" class="input-box" title="پایان تکرار (اختیاری)">
            </div>

            <div id="taskRecurrencePanel" class="recurrence-panel hidden">
                <label class="panel-label">روزهای هفته برای تکرار هفتگی</label>
                <div class="recurrence-days" id="taskWeeklyDays">
                    <button type="button" class="day-chip" data-day="0">ش</button>
                    <button type="button" class="day-chip" data-day="1">ی</button>
                    <button type="button" class="day-chip" data-day="2">د</button>
                    <button type="button" class="day-chip" data-day="3">س</button>
                    <button type="button" class="day-chip" data-day="4">چ</button>
                    <button type="button" class="day-chip" data-day="5">پ</button>
                    <button type="button" class="day-chip" data-day="6">ج</button>
                </div>
                <p class="form-hint">برای برنامه‌هایی مثل کراس‌فیت، روزهای شنبه، دوشنبه و چهارشنبه را انتخاب کن تا در تسک‌ها و تقویم با هم دیده شوند.</p>
            </div>

            <label class="form-check-row">
                <input type="checkbox" id="taskSyncCalendar" checked>
                <span>این تسک در تقویم هم نمایش داده شود.</span>
            </label>

            <textarea id="taskDesc" class="input-box" placeholder="توضیحات تسک..."></textarea>

            <textarea id="taskSubtasks" class="input-box" placeholder="زیرتسک‌ها (هر خط یک زیرتسک)&#10;مثال:&#10;تحقیق اولیه&#10;طراحی اولیه&#10;پیاده‌سازی"></textarea>

            <div style="display: flex; gap: 12px; justify-content: center;">
                <button id="taskSubmitBtn" onclick="addTask()" class="btn-primary">
                    ➕ ایجاد تسک
                </button>
                <button onclick="clearForm()" class="btn-secondary">
                    🗑️ پاک کردن فرم
                </button>
            </div>
        </div>

        <!-- تسک‌های فعال -->
        <div class="tasks-section">
            <div class="section-header">
                <h2 class="section-title">🎯 تسک‌های فعال</h2>
                <span class="section-count" id="activeCount">0</span>
            </div>
            <div class="tasks-grid" id="activeTasks"></div>
        </div>

        <!-- تسک‌های انجام شده -->
        <div class="tasks-section">
            <div class="section-header">
                <h2 class="section-title">✅ تسک‌های انجام شده</h2>
                <span class="section-count" id="completedCount">0</span>
            </div>
            <div class="tasks-grid" id="completedTasks"></div>
        </div>
    </div>

    <!-- نوتیفیکیشن -->
    <div id="notification" class="notification" style="display: none;"></div>

    <!-- مودال تاریک کننده -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <script>
        // متغیرهای سراسری
        let currentFilter = 'all';
        let currentPriorityFilter = 'all';
        let searchQuery = '';

        // تبدیل تاریخ میلادی به شمسی
        function getShamsiDate(dateString) {
            if (!dateString) return 'بدون تاریخ';
            try {
                const date = new Date(dateString);
                const j = jalaali.toJalaali(date);
                const months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
                return `${j.jd} ${months[j.jm - 1]} ${j.jy}`;
            } catch (e) {
                return 'تاریخ نامعتبر';
            }
        }

        // بررسی وضعیت تاریخ
        function getDateStatus(dueDate, dueTime) {
            if (!dueDate) return 'no-date';

            const now = new Date();
            const due = new Date(dueDate + (dueTime ? 'T' + dueTime : ''));

            if (due < now) return 'overdue';
            if (due.toDateString() === now.toDateString()) return 'today';
            return 'upcoming';
        }

        // نمایش نوتیفیکیشن
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // پاک کردن فرم
        function clearForm() {
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskSubtasks').value = '';
            document.getElementById('taskDate').value = '';
            document.getElementById('taskTime').value = '';
            document.getElementById('taskPriority').selectedIndex = 0;
            document.getElementById('taskCategory').selectedIndex = 0;
            document.getElementById('taskRecurring').selectedIndex = 0;
        }

        // ایجاد تسک جدید
        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) {
                showNotification('عنوان تسک را وارد کنید!', 'error');
                return;
            }

            const subtasksText = document.getElementById('taskSubtasks').value;
            const subtasks = subtasksText.split('\n')
                .filter(line => line.trim() !== '')
                .map((line, index) => ({
                    id: index,
                    text: line.trim(),
                    completed: false
                }));

            const task = {
                id: Date.now(),
                title: title,
                description: document.getElementById('taskDesc').value.trim(),
                category: document.getElementById('taskCategory').value,
                priority: document.getElementById('taskPriority').value,
                dueDate: document.getElementById('taskDate').value,
                dueTime: document.getElementById('taskTime').value,
                recurring: document.getElementById('taskRecurring').value,
                subtasks: subtasks,
                completed: false,
                createdAt: new Date().toISOString(),
                completedAt: null,
                tags: []
            };

            const tasks = JSON.parse(localStorage.getItem('advancedTasks')) || [];
            tasks.push(task);
            localStorage.setItem('advancedTasks', JSON.stringify(tasks));

            clearForm();
            showNotification('تسک با موفقیت ایجاد شد!');
            loadTasks();
        }

        // تنظیم فیلتر
        function setFilter(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (button) button.classList.add('active');
            loadTasks();
        }

        function setPriorityFilter(priority) {
            currentPriorityFilter = priority;
            document.querySelectorAll('.filter-group:nth-child(2) .filter-btn').forEach(btn => btn.classList.remove('active'));
            const buttons = document.querySelectorAll('.filter-group:nth-child(2) .filter-btn');
            buttons.forEach(btn => {
                if (btn.textContent.trim() === (priority === 'all' ? 'همه' : priority === 'high' ? 'فوری' : priority === 'medium' ? 'متوسط' : 'عادی')) {
                    btn.classList.add('active');
                }
            });
            loadTasks();
        }

        // فیلتر تسک‌ها
        function filterTasks() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            loadTasks();
        }

        // بارگذاری تسک‌ها
        function loadTasks() {
            let tasks = JSON.parse(localStorage.getItem('advancedTasks')) || [];

            // اعمال فیلترها
            let filteredTasks = tasks.filter(task => {
                // فیلتر وضعیت
                if (currentFilter === 'pending' && task.completed) return false;
                if (currentFilter === 'completed' && !task.completed) return false;
                if (currentFilter === 'overdue' && getDateStatus(task.dueDate, task.dueTime) !== 'overdue') return false;

                // فیلتر اولویت
                if (currentPriorityFilter !== 'all' && task.priority !== currentPriorityFilter) return false;

                // جستجو
                if (searchQuery) {
                    const searchText = `${task.title} ${task.description} ${task.category}`.toLowerCase();
                    if (!searchText.includes(searchQuery)) return false;
                }

                return true;
            });

            // مرتب‌سازی
            filteredTasks.sort((a, b) => {
                // اول تسک‌های تکمیل نشده
                if (a.completed !== b.completed) return a.completed ? 1 : -1;

                // سپس بر اساس تاریخ سررسید
                if (a.dueDate && b.dueDate) {
                    return new Date(a.dueDate + (a.dueTime ? 'T' + a.dueTime : '')) -
                           new Date(b.dueDate + (b.dueTime ? 'T' + b.dueTime : ''));
                }

                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            // جدا کردن تسک‌های فعال و تکمیل شده
            const activeTasks = filteredTasks.filter(task => !task.completed);
            const completedTasks = filteredTasks.filter(task => task.completed);

            // بروزرسانی شمارنده‌ها
            document.getElementById('activeCount').textContent = activeTasks.length;
            document.getElementById('completedCount').textContent = completedTasks.length;

            // نمایش تسک‌ها
            renderTasks(activeTasks, 'activeTasks');
            renderTasks(completedTasks, 'completedTasks');

            // بروزرسانی آمار
            updateStats(tasks);
            updateQuickStats(activeTasks.length, completedTasks.length);
        }

        // رندر تسک‌ها
        function renderTasks(tasks, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-gray);">
                        ${containerId === 'activeTasks' ? 'هیچ تسک فعالی ندارید!' : 'هیچ تسک تکمیل شده‌ای ندارید!'}
                    </div>
                `;
                return;
            }

            tasks.forEach(task => {
                const dateStatus = getDateStatus(task.dueDate, task.dueTime);
                const card = document.createElement('div');
                card.className = `task-card priority-${task.priority} ${task.completed ? 'completed' : ''}`;

                // محاسبه پیشرفت زیرتسک‌ها
                const totalSubtasks = task.subtasks.length;
                const completedSubtasks = task.subtasks.filter(st => st.completed).length;
                const progressPercent = totalSubtasks > 0 ? Math.round((completedSubtasks / totalSubtasks) * 100) : 0;

                card.innerHTML = `
                    <div class="task-header">
                        <div class="task-info">
                            <div class="task-title">
                                ${task.title}
                                ${task.recurring !== 'none' ? '🔄' : ''}
                            </div>
                            <div class="task-meta">
                                <span class="badge category">${getCategoryIcon(task.category)} ${getCategoryName(task.category)}</span>
                                <span class="badge priority-${task.priority}">${getPriorityText(task.priority)}</span>
                                ${task.dueDate ? `<span class="badge date-${dateStatus}">${getDateIcon(dateStatus)} ${getShamsiDate(task.dueDate)}${task.dueTime ? ' ' + task.dueTime : ''}</span>` : ''}
                            </div>
                            ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
                        </div>
                        <div class="task-actions">
                            <button onclick="toggleTask(${task.id})" class="btn-secondary" style="font-size: 12px;">
                                ${task.completed ? '🔄 برگردون' : '✅ انجام شد'}
                            </button>
                            <button onclick="editTask(${task.id})" class="btn-secondary" style="font-size: 12px;">✏️</button>
                            <button onclick="deleteTask(${task.id})" style="background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer;">🗑️</button>
                        </div>
                    </div>

                    ${task.subtasks.length > 0 ? `
                        <div class="subtasks-section">
                            <div class="subtasks-header">
                                <span style="font-weight: 600; color: var(--text-gray);">زیرتسک‌ها (${completedSubtasks}/${totalSubtasks})</span>
                                <div class="subtasks-progress">${progressPercent}%</div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                            <ul class="subtasks-list">
                                ${task.subtasks.map(st => `
                                    <li class="subtask-item ${st.completed ? 'completed' : ''}" onclick="toggleSubtask(${task.id}, ${st.id})">
                                        <div class="subtask-checkbox"></div>
                                        <span class="subtask-text">${st.text}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    ` : ''}
                `;

                container.appendChild(card);
            });
        }

        // توابع کمکی
        function getCategoryIcon(category) {
            const icons = {
                personal: '👤',
                work: '💼',
                study: '📚',
                health: '🏥',
                shopping: '🛒',
                other: '📌'
            };
            return icons[category] || '📌';
        }

        function getCategoryName(category) {
            const names = {
                personal: 'شخصی',
                work: 'کاری',
                study: 'تحصیلی',
                health: 'سلامتی',
                shopping: 'خرید',
                other: 'سایر'
            };
            return names[category] || 'سایر';
        }

        function getPriorityText(priority) {
            const texts = {
                high: 'فوری',
                medium: 'متوسط',
                low: 'عادی'
            };
            return texts[priority] || 'عادی';
        }

        function getDateIcon(status) {
            const icons = {
                overdue: '⏰',
                today: '📅',
                upcoming: '📆',
                'no-date': '📋'
            };
            return icons[status] || '📋';
        }

        // تابع‌های عملیات
        function toggleTask(id) {
            const tasks = JSON.parse(localStorage.getItem('advancedTasks')) || [];
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                task.completedAt = task.completed ? new Date().toISOString() : null;
                localStorage.setItem('advancedTasks', JSON.stringify(tasks));
                showNotification(task.completed ? 'تسک تکمیل شد!' : 'تسک به حالت فعال برگشت!');
                loadTasks();
            }
        }

        function toggleSubtask(taskId, subtaskId) {
            const tasks = JSON.parse(localStorage.getItem('advancedTasks')) || [];
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(st => st.id === subtaskId);
                if (subtask) {
                    subtask.completed = !subtask.completed;
                    localStorage.setItem('advancedTasks', JSON.stringify(tasks));
                    loadTasks();
                }
            }
        }

        function deleteTask(id) {
            if (confirm('آیا مطمئن هستید که می‌خواهید این تسک را حذف کنید؟')) {
                const tasks = JSON.parse(localStorage.getItem('advancedTasks')) || [];
                const filteredTasks = tasks.filter(t => t.id !== id);
                localStorage.setItem('advancedTasks', JSON.stringify(filteredTasks));
                showNotification('تسک حذف شد!');
                loadTasks();
            }
        }

        function editTask(id) {
            // این قابلیت در نسخه‌های بعدی اضافه خواهد شد
            showNotification('قابلیت ویرایش در نسخه‌های بعدی اضافه خواهد شد!', 'error');
        }

        // بروزرسانی آمار
        function updateStats(allTasks) {
            const total = allTasks.length;
            const completed = allTasks.filter(t => t.completed).length;
            const pending = total - completed;
            const overdue = allTasks.filter(t => getDateStatus(t.dueDate, t.dueTime) === 'overdue' && !t.completed).length;

            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">کل تسک‌ها</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-value">${pending}</div>
                    <div class="stat-label">تسک‌های فعال</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value">${completed}</div>
                    <div class="stat-label">تسک‌های تکمیل شده</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏰</div>
                    <div class="stat-value">${overdue}</div>
                    <div class="stat-label">تسک‌های گذشته</div>
                </div>
            `;

            document.getElementById('statsOverview').innerHTML = statsHtml;
        }

        function updateQuickStats(active, completed) {
            document.getElementById('quickStats').innerHTML = `
                <div class="stat-item">
                    <span>🎯 فعال:</span>
                    <span style="font-weight: bold; color: var(--persian-green);">${active}</span>
                </div>
                <div class="stat-item">
                    <span>✅ انجام شده:</span>
                    <span style="font-weight: bold; color: var(--success);">${completed}</span>
                </div>
            `;
        }

        // راه‌اندازی اولیه
        window.onload = function() {
            // تنظیم تاریخ پیش‌فرض برای امروز
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('taskDate').value = today;

            loadTasks();
        };

        // میانبرهای صفحه کلید
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'n':
                        e.preventDefault();
                        document.getElementById('taskTitle').focus();
                        break;
                    case 'f':
                        e.preventDefault();
                        document.getElementById('searchInput').focus();
                        break;
                }
            }
        });
    </script>
</body>
</html>
