openapi: 3.0.3
info:
  title: Calisia Android Subscription API
  version: 0.1.0
servers:
  - url: https://api.example.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/auth/device:
    post:
      summary: Sign in with device id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: Signed in
  /v1/me/subscription:
    get:
      summary: Get current user subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription payload
  /v1/subscriptions/verify/google:
    post:
      summary: Verify google purchase token (stub)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, purchaseToken]
              properties:
                productId:
                  type: string
                purchaseToken:
                  type: string
                orderId:
                  type: string
      responses:
        '200':
          description: Verification result
  /v1/subscriptions/webhook/google:
    post:
      summary: Receive RTDN webhook
      parameters:
        - in: header
          name: x-webhook-secret
          schema:
            type: string
      responses:
        '202':
          description: Accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
