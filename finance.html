<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دارایی‌پرداز - مدیریت دارایی و ثروت</title>
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --persian-green: #1fb580;
            --accent-teal: #17a2b8;
            --light-teal: #e0f2f1;
            --persian-dark: #0e3a2f;
            --warm-cream: #faf8f3;
            --text-dark: #1a1a1a;
            --text-gray: #5a5a5a;
            --shadow-light: rgba(31, 181, 128, 0.08);
            --shadow-medium: rgba(31, 181, 128, 0.15);
            --gold: #d4a574;
            --silver: #c0c0c0;
            --info: #3498db;
            --success: #2ecc71;
            --warning: #e67e22;
            --danger: #e74c3c;
        }

        [data-theme="dark"] {
            --text-dark: #e0e0e0;
            --text-gray: #b0b0b0;
            --warm-cream: #1a1a1a;
            --light-teal: rgba(224, 242, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f3f0 0%, #e8f4f2 50%, #f0f8f6 100%);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px;
            background-attachment: fixed;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0e3a2f 50%, #1a2a28 100%);
        }

        /* ═════════════ هدر صفحه ═════════════ */
        .finance-header {
            max-width: 1400px;
            margin: 0 auto 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 40px var(--shadow-light);
            border: 2px solid rgba(31, 181, 128, 0.15);
            animation: slideInDown 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .finance-header {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .header-text h1 {
            font-size: 42px;
            font-weight: 800;
            color: var(--persian-green);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .header-text p {
            font-size: 16px;
            color: var(--text-gray);
            margin: 0;
        }

        .header-stats {
            display: flex;
            gap: 25px;
        }

        .stat-box {
            text-align: center;
            padding: 20px 30px;
            background: rgba(31, 181, 128, 0.08);
            border-radius: 16px;
            border: 2px solid rgba(31, 181, 128, 0.2);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--persian-green);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ═════════════ بخش اصلی ═════════════ */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--persian-green);
            transform: translateX(5px);
        }

        /* ═════════════ نوار ابزار ═════════════ */
        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--persian-green);
            box-shadow: 0 0 15px rgba(31, 181, 128, 0.2);
            background: white;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }

        /* ═════════════ دکمه‌های اکشن ═════════════ */
        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--persian-green), var(--accent-teal));
            color: white;
            box-shadow: 0 8px 20px rgba(31, 181, 128, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(31, 181, 128, 0.3);
        }

        .btn-secondary {
            background: rgba(31, 181, 128, 0.15);
            color: var(--persian-green);
            border: 2px solid rgba(31, 181, 128, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(31, 181, 128, 0.25);
        }

        /* ═════════════ گرید دارایی‌ها ═════════════ */
        .assets-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .asset-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 12px 32px var(--shadow-light);
            border: 2px solid rgba(31, 181, 128, 0.15);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        [data-theme="dark"] .asset-card {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .asset-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--persian-green), var(--accent-teal));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .asset-card:hover::before {
            transform: scaleX(1);
        }

        .asset-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 60px var(--shadow-medium);
            border-color: rgba(31, 181, 128, 0.3);
        }

        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .asset-icon {
            font-size: 36px;
        }

        .asset-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(31, 181, 128, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(31, 181, 128, 0.25);
        }

        .asset-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--persian-green);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .asset-category {
            font-size: 12px;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .asset-amount {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .asset-value {
            font-size: 16px;
            color: var(--persian-green);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .asset-meta {
            font-size: 12px;
            color: var(--text-gray);
            display: flex;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid rgba(31, 181, 128, 0.1);
        }

        /* ═════════════ مودال فرم ═════════════ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(224,242,241,0.5) 100%);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.2);
            border: 2px solid rgba(31, 181, 128, 0.2);
            animation: slideUp 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        [data-theme="dark"] .modal-content {
            background: linear-gradient(135deg, rgba(45,52,54,0.98) 0%, rgba(52,73,94,0.5) 100%);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(31, 181, 128, 0.15);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--persian-green);
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-gray);
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: var(--persian-green);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--persian-green);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .form-input,
        [data-theme="dark"] .form-select,
        [data-theme="dark"] .form-textarea {
            background: rgba(30, 40, 45, 0.9);
            color: var(--text-dark);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--persian-green);
            box-shadow: 0 0 15px rgba(31, 181, 128, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .currency-selector {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .currency-option {
            padding: 12px;
            border: 2px solid rgba(31, 181, 128, 0.2);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            font-weight: 600;
            color: var(--text-gray);
        }

        .currency-option:hover {
            border-color: var(--persian-green);
            background: rgba(31, 181, 128, 0.1);
        }

        .currency-option.selected {
            background: var(--persian-green);
            color: white;
            border-color: var(--persian-green);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid rgba(31, 181, 128, 0.15);
        }

        .modal-actions button {
            flex: 1;
        }

        /* ═════════════ نمودارها ═════════════ */
        .charts-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 15px 40px var(--shadow-light);
            border: 2px solid rgba(31, 181, 128, 0.15);
            margin-bottom: 40px;
            animation: fadeIn 1s ease;
        }

        [data-theme="dark"] .charts-section {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .charts-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--persian-green);
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* ═════════════ خلاصه ریسک ═════════════ */
        .summary-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(224,242,241,0.3) 100%);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 15px 40px var(--shadow-light);
            border: 2px solid rgba(31, 181, 128, 0.15);
        }

        [data-theme="dark"] .summary-section {
            background: linear-gradient(135deg, rgba(45,52,54,0.95) 0%, rgba(52,73,94,0.3) 100%);
            border-color: rgba(52,73,94,0.3);
        }

        .summary-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--persian-green);
            margin-bottom: 28px;
            letter-spacing: -0.5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .summary-item {
            background: rgba(31, 181, 128, 0.08);
            padding: 20px;
            border-radius: 16px;
            border-left: 4px solid var(--persian-green);
        }

        .summary-label {
            font-size: 13px;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .summary-change {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 8px;
            font-weight: 600;
        }

        .change-positive { color: var(--success); }
        .change-negative { color: var(--danger); }

        /* ═════════════ ریسپانسیو ═════════════ */
        @media (max-width: 968px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-stats {
                flex-wrap: wrap;
                width: 100%;
            }

            .stat-box {
                flex: 1;
                min-width: 150px;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .finance-header {
                padding: 24px;
            }

            .header-text h1 {
                font-size: 28px;
            }

            .modal-content {
                padding: 24px;
            }

            .assets-container {
                grid-template-columns: 1fr;
            }
        }

        /* ═════════════ تم تاریک ═════════════ */
        [data-theme="dark"] .search-box input {
            background: rgba(30, 40, 45, 0.9);
            color: var(--text-dark);
            border-color: rgba(52, 73, 94, 0.3);
        }

        [data-theme="dark"] .currency-option {
            background: rgba(30, 40, 45, 0.5);
        }

        [data-theme="dark"] .summary-item {
            background: rgba(52, 73, 94, 0.2);
            border-left-color: var(--accent-teal);
        }
    </style>
</head>
<body data-theme="light">

    <a href="index.html" class="back-link">🔙 بازگشت به داشبورد</a>

    <!-- هدر -->
    <div class="finance-header">
        <div class="header-content">
            <div class="header-text">
                <h1>💰 دارایی‌پرداز</h1>
                <p>مدیریت جامع دارایی‌ها و ثروت شخصی</p>
            </div>
            <div class="header-stats">
                <div class="stat-box">
                    <div class="stat-value" id="totalWealthDisplay">0 تومان</div>
                    <div class="stat-label">کل ثروت</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="assetCountDisplay">0</div>
                    <div class="stat-label">تعداد دارایی‌ها</div>
                </div>
            </div>
        </div>
    </div>

    <!-- نوار ابزار -->
    <div class="main-container">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="جستجو در دارایی‌ها...">
            </div>
            <div class="action-buttons">
                <button class="btn btn-secondary" id="filterBtn" onclick="toggleFilters()">🎯 فیلتر</button>
                <button class="btn btn-primary" onclick="openAddModal()">➕ افزودن دارایی</button>
            </div>
        </div>

        <!-- نمودارها -->
        <div class="charts-section">
            <div class="charts-title">📊 تجزیه و تحلیل دارایی‌ها</div>
            <div class="charts-grid">
                <div>
                    <h3 style="text-align: center; color: var(--persian-green); margin-bottom: 16px; font-size: 16px;">توزیع دسته‌بندی‌ها</h3>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div>
                    <h3 style="text-align: center; color: var(--persian-green); margin-bottom: 16px; font-size: 16px;">نسبت ریسک</h3>
                    <div class="chart-container">
                        <canvas id="riskChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- دارایی‌ها -->
        <div id="assetsContainer" class="assets-container"></div>

        <!-- خلاصه و تحلیل -->
        <div class="summary-section">
            <div class="summary-title">📈 خلاصه عملکرد</div>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">بالاترین دارایی</div>
                    <div class="summary-value" id="topAsset">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">دارایی‌های نقدی</div>
                    <div class="summary-value" id="liquidAssets">0 تومان</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">دارایی‌های ثابت</div>
                    <div class="summary-value" id="fixedAssets">0 تومان</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">متوسط درجه ریسک</div>
                    <div class="summary-value" id="avgRisk">متوسط</div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال افزودن دارایی -->
    <div class="modal" id="assetModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">افزودن دارایی جدید</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <form id="assetForm" onsubmit="saveAsset(event)">
                <div class="form-group">
                    <label class="form-label">نوع دارایی</label>
                    <select class="form-select" id="assetType" onchange="updateCurrencies()" required>
                        <option value="">انتخاب کنید...</option>
                        <option value="طلا">طلا (گرم)</option>
                        <option value="نقره">نقره (گرم)</option>
                        <option value="مسکن">مسکن</option>
                        <option value="خودرو">خودرو</option>
                        <option value="دلار">دلار</option>
                        <option value="یورو">یورو</option>
                        <option value="رمزارز">رمزارز</option>
                        <option value="سهام">سهام</option>
                        <option value="وام">وام</option>
                        <option value="بانک">حساب بانکی</option>
                        <option value="سپرده">سپرده</option>
                        <option value="مجوهرات">مجوهرات</option>
                        <option value="هنری">آثار هنری</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">نام دارایی</label>
                    <input type="text" class="form-input" id="assetName" placeholder="مثال: خانه تهران" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">مقدار</label>
                        <input type="number" class="form-input" id="assetQuantity" placeholder="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">واحد</label>
                        <input type="text" class="form-input" id="assetUnit" placeholder="گرم، دستگاه، ..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">قیمت واحد</label>
                    <input type="number" class="form-input" id="assetPricePerUnit" placeholder="0" step="0.01" onchange="calculateTotal()" required>
                </div>

                <div class="form-group">
                    <label class="form-label">ارزش کل</label>
                    <input type="number" class="form-input" id="assetTotalValue" placeholder="0" step="0.01" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">درجه ریسک</label>
                    <select class="form-select" id="assetRisk" required>
                        <option value="کم">ریسک کم 🟢</option>
                        <option value="متوسط">ریسک متوسط 🟡</option>
                        <option value="زیاد">ریسک زیاد 🔴</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">توضیحات اضافی</label>
                    <textarea class="form-textarea" id="assetNotes" placeholder="یادداشت‌های مربوط به این دارایی..." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">تاریخ ثبت</label>
                    <input type="date" class="form-input" id="assetDate" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">لغو</button>
                    <button type="submit" class="btn btn-primary">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============ متغیرهای عمومی ============
        let assets = [];
        let editingId = null;
        let categoryChart = null;
        let riskChart = null;

        // دسته‌بندی‌های دارایی
        const assetCategories = {
            'طلا': { icon: '🏆', riskLevel: 'کم', type: 'precious' },
            'نقره': { icon: '⚪', riskLevel: 'کم', type: 'precious' },
            'مسکن': { icon: '🏠', riskLevel: 'کم', type: 'fixed' },
            'خودرو': { icon: '🚗', riskLevel: 'متوسط', type: 'fixed' },
            'دلار': { icon: '💵', riskLevel: 'متوسط', type: 'liquid' },
            'یورو': { icon: '💶', riskLevel: 'متوسط', type: 'liquid' },
            'رمزارز': { icon: '₿', riskLevel: 'زیاد', type: 'liquid' },
            'سهام': { icon: '📈', riskLevel: 'متوسط', type: 'liquid' },
            'وام': { icon: '📋', riskLevel: 'متوسط', type: 'liability' },
            'بانک': { icon: '🏦', riskLevel: 'کم', type: 'liquid' },
            'سپرده': { icon: '💳', riskLevel: 'کم', type: 'liquid' },
            'مجوهرات': { icon: '💎', riskLevel: 'کم', type: 'precious' },
            'هنری': { icon: '🎨', riskLevel: 'متوسط', type: 'fixed' }
        };

        // ============ بارگذاری اولیه ============
        window.onload = function() {
            setDefaultDate();
            loadAssets();
            renderAssets();
            updateCharts();
            updateSummary();
            loadTheme();
        };

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('assetDate').value = today;
        }

        // ============ مدیریت دارایی‌ها ============
        function loadAssets() {
            const saved = localStorage.getItem('financeAssets');
            assets = saved ? JSON.parse(saved) : [];
        }

        function saveAssets() {
            localStorage.setItem('financeAssets', JSON.stringify(assets));
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = '➕ افزودن دارایی جدید';
            document.getElementById('assetForm').reset();
            setDefaultDate();
            document.getElementById('assetModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('assetModal').classList.remove('active');
            document.getElementById('assetForm').reset();
        }

        function calculateTotal() {
            const qty = parseFloat(document.getElementById('assetQuantity').value) || 0;
            const price = parseFloat(document.getElementById('assetPricePerUnit').value) || 0;
            const total = (qty * price).toFixed(2);
            document.getElementById('assetTotalValue').value = total;
        }

        function updateCurrencies() {
            const type = document.getElementById('assetType').value;
            const unit = document.getElementById('assetUnit');
            
            const unitMap = {
                'طلا': 'گرم',
                'نقره': 'گرم',
                'مسکن': 'متر مربع',
                'خودرو': 'دستگاه',
                'دلار': 'دلار',
                'یورو': 'یورو',
                'رمزارز': 'واحد',
                'سهام': 'سهم',
                'وام': 'تومان',
                'بانک': 'تومان',
                'سپرده': 'تومان',
                'مجوهرات': 'قیراط',
                'هنری': 'اثر'
            };

            unit.value = unitMap[type] || '';
        }

        function saveAsset(event) {
            event.preventDefault();

            const asset = {
                id: editingId || Date.now(),
                type: document.getElementById('assetType').value,
                name: document.getElementById('assetName').value,
                quantity: parseFloat(document.getElementById('assetQuantity').value),
                unit: document.getElementById('assetUnit').value,
                pricePerUnit: parseFloat(document.getElementById('assetPricePerUnit').value),
                totalValue: parseFloat(document.getElementById('assetTotalValue').value),
                risk: document.getElementById('assetRisk').value,
                notes: document.getElementById('assetNotes').value,
                date: document.getElementById('assetDate').value
            };

            if (editingId) {
                const index = assets.findIndex(a => a.id === editingId);
                assets[index] = asset;
            } else {
                assets.push(asset);
            }

            saveAssets();
            renderAssets();
            updateCharts();
            updateSummary();
            closeModal();
        }

        function editAsset(id) {
            const asset = assets.find(a => a.id === id);
            if (!asset) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = '✏️ ویرایش دارایی';
            document.getElementById('assetType').value = asset.type;
            document.getElementById('assetName').value = asset.name;
            document.getElementById('assetQuantity').value = asset.quantity;
            document.getElementById('assetUnit').value = asset.unit;
            document.getElementById('assetPricePerUnit').value = asset.pricePerUnit;
            document.getElementById('assetTotalValue').value = asset.totalValue;
            document.getElementById('assetRisk').value = asset.risk;
            document.getElementById('assetNotes').value = asset.notes;
            document.getElementById('assetDate').value = asset.date;

            document.getElementById('assetModal').classList.add('active');
        }

        function deleteAsset(id) {
            if (confirm('آیا مطمئن‌اید؟')) {
                assets = assets.filter(a => a.id !== id);
                saveAssets();
                renderAssets();
                updateCharts();
                updateSummary();
            }
        }

        function renderAssets() {
            const container = document.getElementById('assetsContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = assets.filter(a => 
                a.name.toLowerCase().includes(searchTerm) || 
                a.type.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-gray);">هنوز دارایی‌ای ثبت نکردی. 🤔</div>';
                return;
            }

            container.innerHTML = filtered.map(asset => {
                const cat = assetCategories[asset.type];
                const icon = cat?.icon || '📦';
                return `
                    <div class="asset-card">
                        <div class="asset-header">
                            <div class="asset-icon">${icon}</div>
                            <div class="asset-actions">
                                <button class="icon-btn" onclick="editAsset(${asset.id})" title="ویرایش">✏️</button>
                                <button class="icon-btn" onclick="deleteAsset(${asset.id})" title="حذف">🗑️</button>
                            </div>
                        </div>
                        <div class="asset-title">${asset.name}</div>
                        <div class="asset-category">${asset.type}</div>
                        <div class="asset-amount">${asset.quantity.toLocaleString('fa-IR')} ${asset.unit}</div>
                        <div class="asset-value">${formatCurrency(asset.totalValue)}</div>
                        <div class="asset-meta">
                            <span>قیمت واحد: ${formatCurrency(asset.pricePerUnit)}</span>
                            <span>ریسک: ${asset.risk}</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('assetCountDisplay').textContent = filtered.length;
        }

        function updateCharts() {
            if (assets.length === 0) return;

            // نمودار توزیع دسته‌بندی
            const categoryData = {};
            assets.forEach(a => {
                categoryData[a.type] = (categoryData[a.type] || 0) + a.totalValue;
            });

            const categoryCtx = document.getElementById('categoryChart').getContext('2d');
            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(categoryCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryData),
                    datasets: [{
                        data: Object.values(categoryData),
                        backgroundColor: [
                            '#1fb580', '#17a2b8', '#3498db', '#e74c3c',
                            '#f39c12', '#9b59b6', '#1abc9c', '#c0392b'
                        ],
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { family: "'Vazirmatn', sans-serif" } } } }
                }
            });

            // نمودار ریسک
            const riskData = { 'کم': 0, 'متوسط': 0, 'زیاد': 0 };
            assets.forEach(a => {
                riskData[a.risk] = (riskData[a.risk] || 0) + a.totalValue;
            });

            const riskCtx = document.getElementById('riskChart').getContext('2d');
            if (riskChart) riskChart.destroy();
            riskChart = new Chart(riskCtx, {
                type: 'pie',
                data: {
                    labels: ['ریسک کم 🟢', 'ریسک متوسط 🟡', 'ریسک زیاد 🔴'],
                    datasets: [{
                        data: [riskData['کم'] || 0, riskData['متوسط'] || 0, riskData['زیاد'] || 0],
                        backgroundColor: ['#2ecc71', '#f39c12', '#e74c3c'],
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { family: "'Vazirmatn', sans-serif" } } } }
                }
            });
        }

        function updateSummary() {
            const total = assets.reduce((sum, a) => sum + a.totalValue, 0);
            document.getElementById('totalWealthDisplay').textContent = formatCurrency(total);

            // بالاترین دارایی
            const top = assets.length ? assets.reduce((max, a) => a.totalValue > max.totalValue ? a : max) : null;
            document.getElementById('topAsset').textContent = top ? `${top.name} (${formatCurrency(top.totalValue)})` : '—';

            // دارایی‌های نقدی
            const liquid = assets
                .filter(a => assetCategories[a.type]?.type === 'liquid')
                .reduce((sum, a) => sum + a.totalValue, 0);
            document.getElementById('liquidAssets').textContent = formatCurrency(liquid);

            // دارایی‌های ثابت
            const fixed = assets
                .filter(a => assetCategories[a.type]?.type === 'fixed')
                .reduce((sum, a) => sum + a.totalValue, 0);
            document.getElementById('fixedAssets').textContent = formatCurrency(fixed);

            // متوسط ریسک
            const risks = assets.map(a => a.risk);
            const riskScore = risks.filter(r => r === 'کم').length + (risks.filter(r => r === 'متوسط').length * 2) + (risks.filter(r => r === 'زیاد').length * 3);
            const avgRiskLevel = riskScore / assets.length;
            let riskText = 'پایین';
            if (avgRiskLevel >= 2.5) riskText = 'زیاد';
            else if (avgRiskLevel >= 1.5) riskText = 'متوسط';
            document.getElementById('avgRisk').textContent = riskText;
        }

        // ============ توابع کمکی ============
        function formatCurrency(value) {
            return new Intl.NumberFormat('fa-IR', {
                style: 'currency',
                currency: 'IRR',
                minimumFractionDigits: 0
            }).format(value);
        }

        function toggleFilters() {
            alert('فیلترهای پیشرفته به‌زودی اضافه خواهند شد! 🚀');
        }

        // تم تاریک
        function loadTheme() {
            const theme = localStorage.getItem('dashboardTheme') || 'light';
            document.body.setAttribute('data-theme', theme);
        }

        // جستجو آنی
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchInput')?.addEventListener('input', renderAssets);
        });
    </script>
</body>
</html>
